:root {
  --ground: #FFFFFF;
  --ink: #221F1D;
  --ink-faint: #A2968F;
  --accent: #C8613D;
  --accent-soft: #E9BCA9;
  --tick: rgba(200, 97, 61, 0.55);
  --tick-faint: rgba(200, 97, 61, 0.22);
  --hairline: rgba(34, 31, 29, 0.12);

  --display: "Anthropic Display", "Anthropic Text", Charter, Georgia, serif;
  --serif: "Anthropic Text", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #17110F;
    --ink: #F2EAE5;
    --ink-faint: #6F625B;
    --accent: #D97757;
    --accent-soft: #8C4B33;
    --tick: rgba(217, 119, 87, 0.62);
    --tick-faint: rgba(217, 119, 87, 0.24);
    --hairline: rgba(242, 234, 229, 0.12);
  }
}

:root[data-theme="dark"] {
  --ground: #17110F;
  --ink: #F2EAE5;
  --ink-faint: #6F625B;
  --accent: #D97757;
  --accent-soft: #8C4B33;
  --tick: rgba(217, 119, 87, 0.62);
  --tick-faint: rgba(217, 119, 87, 0.24);
  --hairline: rgba(242, 234, 229, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  transition: background 300ms ease, color 300ms ease;
}

.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.75rem, 1rem + 3vw, 3rem);
  padding: 5rem 1.25rem 4rem;
  text-align: center;
}

/* ---------- theme switch ---------- */

.theme {
  position: fixed;
  top: 1.25rem;
  left: 1.25rem;
  z-index: 5;
  appearance: none;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--accent);
  border-radius: 999px;
  width: 2.4rem;
  height: 2.4rem;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 200ms ease, transform 200ms ease;
}

.theme:hover {
  border-color: var(--accent);
  transform: rotate(-12deg);
}

.theme svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

.theme .sun {
  display: none;
}

:root[data-theme="dark"] .theme .sun,

/* ---------- wordmark ---------- */

.wordmark {
  margin: 0;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(2.6rem, 1.8rem + 3.4vw, 4.4rem);
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--accent);
}

/* ---------- dial ---------- */

.dial {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0.9rem 0;
  width: min(100%, 46rem);
  position: relative;
  cursor: pointer;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  overflow: hidden;
  display: block;
}

.dial::before,
.dial::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 5rem;
  pointer-events: none;
  z-index: 2;
}

.dial::before {
  left: 0;
  background: linear-gradient(to right, var(--ground), transparent);
}

.dial::after {
  right: 0;
  background: linear-gradient(to left, var(--ground), transparent);
}

.dial-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 34px;
  transition: transform 820ms cubic-bezier(0.18, 0.9, 0.22, 1);
}

.dial-track i {
  flex: 0 0 1.5px;
  background: var(--tick-faint);
  border-radius: 2px;
}

.dial-track i.major {
  background: var(--tick);
}

.needle {
  position: absolute;
  top: 0.35rem;
  bottom: 0.35rem;
  left: 50%;
  width: 1.5px;
  background: var(--accent);
  transform: translateX(-50%);
  z-index: 3;
}

.needle::before {
  content: "";
  position: absolute;
  top: -4px;
  left: 50%;
  width: 8px;
  height: 8px;
  background: var(--accent);
  transform: translateX(-50%) rotate(45deg);
}

.freq {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin: -1.25rem 0 0;
}

/* ---------- topic ---------- */

.topic {
  margin: 0;
  max-width: 24ch;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(1.6rem, 1.1rem + 2.4vw, 2.9rem);
  line-height: 1.22;
  letter-spacing: -0.015em;
  color: var(--ink);
  text-wrap: balance;
  transition: opacity 220ms ease, transform 220ms ease;
}

.topic.swap {
  opacity: 0;
  transform: translateY(6px);
}

/* ---------- spin button ---------- */

.spin {
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--ground);
  border-radius: 999px;
  padding: 0.6rem 1.35rem 0.6rem 1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--serif);
  font-size: 0.95rem;
  cursor: pointer;
  transition: filter 180ms ease, transform 140ms ease;
}

.spin:hover {
  filter: brightness(1.06);
}

.spin:active {
  transform: translateY(1px);
}

.spin svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
  transition: transform 700ms cubic-bezier(0.18, 0.9, 0.22, 1);
}

.spin.turning svg {
  transform: rotate(180deg);
}

.spin kbd {
  font-family: var(--mono);
  font-size: 0.7rem;
  border: 1px solid currentColor;
  border-radius: 4px;
  padding: 0.05rem 0.32rem;

}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 1ms !important;
  }
}

const root = document.documentElement;
const dial = document.getElementById("dial");
const track = document.getElementById("track");
const topicEl = document.getElementById("topic");
const freqEl = document.getElementById("freq");
const spinBtn = document.getElementById("spin");
const spinLabel = document.getElementById("spinLabel");
const themeBtn = document.getElementById("themeBtn");

/* ---------- theme ---------- */

function storedTheme() {
  try {
    return window.localStorage.getItem("tuner-theme");
  } catch (error) {
    return null;
  }
}

function storeTheme(value) {
  try {
    window.localStorage.setItem("tuner-theme", value);
  } catch (error) {
    /* private mode or sandboxed storage — the toggle still works for this session */
  }
}

const saved = storedTheme();
if (saved) {
  root.setAttribute("data-theme", saved);
}

themeBtn.addEventListener("click", () => {
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const current = root.getAttribute("data-theme") || (systemDark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  storeTheme(next);
});

/* ---------- Claude mark ---------- */

function drawMark() {
  const spokes = 12;
  const svg = document.getElementById("mark");
  for (let i = 0; i < spokes; i++) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M12 1.9c.75 3.3 1.05 5.9 1.05 8.2 0 1-.35 1.9-1.05 1.9s-1.05-.9-1.05-1.9c0-2.3.3-4.9 1.05-8.2z");
    path.setAttribute("transform", `rotate(${(360 / spokes) * i} 12 12)`);
    svg.appendChild(path);
  }
}

/* ---------- dial ---------- */

function buildDial() {
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 130; i++) {
    const tick = document.createElement("i");
    const major = i % 5 === 0;
    tick.style.height = major ? "26px" : "12px";
    if (major) {
      tick.classList.add("major");
    }
    fragment.appendChild(tick);
  }
  track.appendChild(fragment);
}

/* ---------- spinning ---------- */

let bag = [];
let started = false;

function refill() {
  bag = TOPICS.slice();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
}

function spin() {
  const topic = bag.length ? bag.pop() : (refill(), bag.pop());
  const drift = Math.round((Math.random() - 0.5) * 420);
  const station = (87.5 + Math.random() * 20.4).toFixed(1);

  track.style.transform = `translateX(${drift}px)`;
  spinBtn.classList.toggle("turning");
  topicEl.classList.add("swap");

  window.setTimeout(() => {
    topicEl.textContent = topic;
    topicEl.classList.remove("swap");
    freqEl.textContent = `${station} FM`;
  }, 220);

  if (!started) {
    started = true;
    spinLabel.innerHTML = "Spin again";
  }
}

dial.addEventListener("click", spin);
spinBtn.addEventListener("click", spin);

document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") {
    return;
  }
  event.preventDefault();
  spin();
});

drawMark();
buildDial();
refill();
