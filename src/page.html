<title>Tuner</title>

<style>
__FONTS__

:root {
  --ground: #FFFFFF;
  --ink: #221F1D;
  --ink-faint: #A2968F;
  --accent: #C8613D;
  --accent-soft: #E9BCA9;
  --tick: rgba(200, 97, 61, 0.55);
  --tick-faint: rgba(200, 97, 61, 0.22);
  --hairline: rgba(34, 31, 29, 0.12);

  --display: "Anthropic Display", "Anthropic Text", Charter, Georgia, serif;
  --serif: "Anthropic Text", Charter, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #17110F;
    --ink: #F2EAE5;
    --ink-faint: #6F625B;
    --accent: #D97757;
    --accent-soft: #8C4B33;
    --tick: rgba(217, 119, 87, 0.62);
    --tick-faint: rgba(217, 119, 87, 0.24);
    --hairline: rgba(242, 234, 229, 0.12);
  }
}

:root[data-theme="dark"] {
  --ground: #17110F;
  --ink: #F2EAE5;
  --ink-faint: #6F625B;
  --accent: #D97757;
  --accent-soft: #8C4B33;
  --tick: rgba(217, 119, 87, 0.62);
  --tick-faint: rgba(217, 119, 87, 0.24);
  --hairline: rgba(242, 234, 229, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
  transition: background 300ms ease, color 300ms ease;
}

.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1.75rem, 1rem + 3vw, 3rem);
  padding: 5rem 1.25rem 4rem;
  text-align: center;
}

/* ---------- theme switch ---------- */

.theme {
  position: fixed;
  top: 1.25rem;
  left: 1.25rem;
  z-index: 5;
  appearance: none;
  border: 1px solid var(--hairline);
  background: transparent;
  color: var(--accent);
  border-radius: 999px;
  width: 2.4rem;
  height: 2.4rem;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: border-color 200ms ease, transform 200ms ease;
}

.theme:hover {
  border-color: var(--accent);
  transform: rotate(-12deg);
}

.theme svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

.theme .sun {
  display: none;
}

:root[data-theme="dark"] .theme .sun,
:root:not([data-theme="light"]) .theme .sun {
  display: block;
}

:root[data-theme="dark"] .theme .moon,
:root:not([data-theme="light"]) .theme .moon {
  display: none;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) .theme .sun {
    display: none;
  }

  :root:not([data-theme="dark"]) .theme .moon {
    display: block;
  }
}

:root[data-theme="light"] .theme .sun {
  display: none;
}

:root[data-theme="light"] .theme .moon {
  display: block;
}

/* ---------- wordmark ---------- */

.wordmark {
  margin: 0;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(2.6rem, 1.8rem + 3.4vw, 4.4rem);
  line-height: 1;
  letter-spacing: -0.025em;
  color: var(--accent);
}

/* ---------- dial ---------- */

.dial {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0.9rem 0;
  width: min(100%, 46rem);
  position: relative;
  cursor: pointer;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  overflow: hidden;
  display: block;
}

.dial::before,
.dial::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 5rem;
  pointer-events: none;
  z-index: 2;
}

.dial::before {
  left: 0;
  background: linear-gradient(to right, var(--ground), transparent);
}

.dial::after {
  right: 0;
  background: linear-gradient(to left, var(--ground), transparent);
}

.dial-track {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 34px;
}

.dial-track i {
  flex: 0 0 1.5px;
  background: var(--tick-faint);
  border-radius: 2px;
}

.dial-track i.major {
  background: var(--tick);
}

.needle {
  position: absolute;
  top: 0.35rem;
  bottom: 0.35rem;
  left: 50%;
  width: 1.5px;
  background: var(--accent);
  transform: translateX(-50%);
  z-index: 3;
}

.needle::before {
  content: "";
  position: absolute;
  top: -4px;
  left: 50%;
  width: 8px;
  height: 8px;
  background: var(--accent);
  transform: translateX(-50%) rotate(45deg);
}

.freq {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  margin: -1.25rem 0 0;
}

.status {
  margin: 0 0 -1.4rem;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.75;
}

/* ---------- topic ---------- */

.topic-slot {
  display: grid;
  place-items: center;
  width: min(100%, 34rem);
  min-height: 7.5rem;
}

.topic {
  grid-area: 1 / 1;
  margin: 0;
  max-width: 24ch;
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(1.6rem, 1.1rem + 2.4vw, 2.9rem);
  line-height: 1.22;
  letter-spacing: -0.015em;
  color: var(--ink);
  text-wrap: balance;
  will-change: opacity, transform, filter;
}

/* Each candidate that flashes past during the spin. */
.topic.flick {
  animation: flick 260ms ease-out both;
}

@keyframes flick {
  from {
    opacity: 0;
    transform: translateY(7px) scale(0.985);
  }

  to {
    opacity: 0.72;
    transform: none;
  }
}

/* The one it lands on. */
.topic.landed {
  animation: land 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes land {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

/* ---------- spin button ---------- */

.spin {
  appearance: none;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--ground);
  border-radius: 999px;
  padding: 0.6rem 1.35rem 0.6rem 1rem;
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--serif);
  font-size: 0.95rem;
  cursor: pointer;
  transition: filter 180ms ease, transform 140ms ease;
}

.spin:hover {
  filter: brightness(1.06);
}

.spin:active {
  transform: translateY(1px);
}

.spin svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.spin.turning svg {
  animation: mark-turn 1.6s linear infinite;
}

@keyframes mark-turn {
  to {
    transform: rotate(360deg);
  }
}

.spin kbd {
  font-family: var(--mono);
  font-size: 0.7rem;
  border: 1px solid currentColor;
  border-radius: 4px;
  padding: 0.05rem 0.32rem;
  opacity: 0.75;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition-duration: 1ms !important;
  }
}
</style>

<button class="theme" id="themeBtn" type="button" aria-label="Switch between light and dark">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.6"></circle>
    <path d="M12 1.4v3.1M12 19.5v3.1M22.6 12h-3.1M4.5 12H1.4M19.5 4.5l-2.2 2.2M6.7 17.3l-2.2 2.2M19.5 19.5l-2.2-2.2M6.7 6.7L4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"></path>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M20.5 14.6A8.8 8.8 0 0 1 9.4 3.5a8.9 8.9 0 1 0 11.1 11.1z"></path>
  </svg>
</button>

<main class="stage">

  <h1 class="wordmark">Tuner.</h1>

  <button class="dial" id="dial" type="button" aria-label="Spin for a new topic">
    <span class="dial-track" id="track"></span>
    <span class="needle"></span>
  </button>

  <p class="freq" id="freq">88.1 FM</p>

  <p class="status" id="status">ready</p>

  <div class="topic-slot">
    <p class="topic" id="topic" aria-live="polite">Press space to begin.</p>
  </div>

  <button class="spin" id="spin" type="button">
    <svg id="mark" viewBox="0 0 24 24" aria-hidden="true"></svg>
    <span id="spinLabel">Press <kbd>space</kbd> to begin</span>
  </button>

</main>

<script>
__TOPICS__

const root = document.documentElement;
const dial = document.getElementById("dial");
const track = document.getElementById("track");
const topicEl = document.getElementById("topic");
const freqEl = document.getElementById("freq");
const statusEl = document.getElementById("status");
const spinBtn = document.getElementById("spin");
const spinLabel = document.getElementById("spinLabel");
const themeBtn = document.getElementById("themeBtn");

/* ---------- theme ---------- */

function storedTheme() {
  try {
    return window.localStorage.getItem("tuner-theme");
  } catch (error) {
    return null;
  }
}

function storeTheme(value) {
  try {
    window.localStorage.setItem("tuner-theme", value);
  } catch (error) {
    /* private mode or sandboxed storage — the toggle still works for this session */
  }
}

const saved = storedTheme();
if (saved) {
  root.setAttribute("data-theme", saved);
}

themeBtn.addEventListener("click", () => {
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const current = root.getAttribute("data-theme") || (systemDark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  storeTheme(next);
});

/* ---------- Claude mark ---------- */

function drawMark() {
  const spokes = 12;
  const svg = document.getElementById("mark");
  for (let i = 0; i < spokes; i++) {
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", "M12 1.9c.75 3.3 1.05 5.9 1.05 8.2 0 1-.35 1.9-1.05 1.9s-1.05-.9-1.05-1.9c0-2.3.3-4.9 1.05-8.2z");
    path.setAttribute("transform", `rotate(${(360 / spokes) * i} 12 12)`);
    svg.appendChild(path);
  }
}

/* ---------- dial ---------- */

function buildDial() {
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 130; i++) {
    const tick = document.createElement("i");
    const major = i % 5 === 0;
    tick.style.height = major ? "26px" : "12px";
    if (major) {
      tick.classList.add("major");
    }
    fragment.appendChild(tick);
  }
  track.appendChild(fragment);
}

/* ---------- the pool ---------- */

let bag = [];

function refill() {
  bag = TOPICS.slice();
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
}

function next() {
  if (!bag.length) {
    refill();
  }
  return bag.pop();
}

/* ---------- spinning ----------
   One rAF loop drives everything: the dial scrolls, the frequency climbs, and
   candidate topics flash past. All three decelerate on the same curve, so the
   spin reads as a single mechanism winding down rather than three timers. */

const TICK_PITCH = 42.5; /* five ticks — the repeat unit, so the scroll loops seamlessly */
const MIN_GAP = 46;      /* ms between topics at full speed */
const MAX_GAP = 620;     /* ms between the last few, when it is crawling */
const TOP_SPEED = 2.6;   /* dial pixels per ms at the start */

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

let spinning = false;
let started = false;
let offset = 0;

function show(text, landed) {
  topicEl.classList.remove("flick", "landed");
  void topicEl.offsetWidth; /* restart the animation */
  topicEl.textContent = text;
  topicEl.classList.add(landed ? "landed" : "flick");
}

function spin() {
  if (spinning) {
    return;
  }

  const landing = next();

  if (!started) {
    started = true;
    spinLabel.textContent = "Spin again";
  }

  if (reduceMotion.matches) {
    show(landing, true);
    statusEl.textContent = "ready";
    freqEl.textContent = `${(87.5 + Math.random() * 20.4).toFixed(1)} FM`;
    return;
  }

  spinning = true;
  statusEl.textContent = "drawing…";
  spinBtn.classList.add("turning");
  spinBtn.setAttribute("aria-busy", "true");

  const duration = 3600 + Math.random() * 1300; /* 3.6 – 4.9s */
  const start = performance.now();
  let last = start;
  let nextSwapAt = start;

  function frame(now) {
    const progress = Math.min(1, (now - start) / duration);
    const decay = Math.pow(1 - progress, 2.2); /* 1 → 0: how much momentum is left */
    const delta = Math.min(now - last, 48);
    last = now;

    offset = (offset + TOP_SPEED * decay * delta) % TICK_PITCH;
    track.style.transform = `translateX(${-offset}px)`;

    freqEl.textContent = `${(87.5 + (((1 - decay) * 47 + progress * 11) % 20.4)).toFixed(1)} FM`;

    if (now >= nextSwapAt && progress < 1) {
      show(next(), false);
      topicEl.style.filter = decay > 0.35 ? `blur(${(decay * 2.4).toFixed(2)}px)` : "none";
      nextSwapAt = now + MIN_GAP + (MAX_GAP - MIN_GAP) * Math.pow(progress, 2.6);
    }

    if (progress < 1) {
      window.requestAnimationFrame(frame);
      return;
    }

    topicEl.style.filter = "none";
    show(landing, true);
    statusEl.textContent = "ready";
    spinBtn.classList.remove("turning");
    spinBtn.removeAttribute("aria-busy");
    spinning = false;
  }

  window.requestAnimationFrame(frame);
}

dial.addEventListener("click", spin);
spinBtn.addEventListener("click", spin);

document.addEventListener("keydown", (event) => {
  if (event.code !== "Space") {
    return;
  }
  event.preventDefault();
  spin();
});

drawMark();
buildDial();
refill();
</script>
